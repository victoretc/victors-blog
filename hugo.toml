baseURL = 'https://victoretc.github.io/victors-blog/'
title = 'Spoon of Quality'
theme = 'my-blog-theme'

defaultContentLanguage = 'ru'
defaultContentLanguageInSubdir = false

[languages.ru]
  contentDir = 'content/ru'
  languageCode = 'ru-ru'
  languageName = 'Русский'
  weight = 1

  [languages.ru.params]
    flag = '🇷🇺'
    description = 'Блог о качестве ПО: тестирование, автоматизация и AI-эксперименты.'

[languages.en]
  contentDir = 'content/en'
  languageCode = 'en-us'
  languageName = 'English'
  weight = 2

  [languages.en.params]
    flag = '🇬🇧'
    description = 'A software quality blog: testing, automation and AI experiments.'

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false 
  [markup.highlight]
    style = "dracula"
    lineNos = false
    noClasses = true
    tabWidth = 4
    